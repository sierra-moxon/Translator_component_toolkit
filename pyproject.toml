[project]
name = "mcp-translator"
version = "0.1.0"
description = "Translator Component Toolkit - MCP Server for Biomedical Translator Tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Guangrong Qin", email = "guangrong.qin@isbscience.org"},
    {name = "Yue Zhang"},
    {name = "Sierra Moxon"},
]
license = {text = "MIT"}
keywords = ["biomedical", "translator", "mcp", "knowledge-graph", "trapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.25.0",
    "pandas>=1.3.0",
    "fastmcp>=2.12.2",
    "mcp>=1.2.0",
    "seaborn>=0.11.0",
    "matplotlib>=3.3.0",
    "ipycytoscape>=1.3.0",
    "networkx>=2.6.0",
    "numpy>=1.21.0",
    "openai>=1.0.0",
    "ipykernel>=6.0.0",
    "pyyaml>=6.0.0",
    "jsons",
    "click>=8.2.1",
    "igraph",
    "pyvis",
    "zstandard",
]

[project.urls]
Homepage = "https://github.com/NCATSTranslator/Translator_component_toolkit"
Documentation = "https://ncatstranslator.github.io/Translator_component_toolkit/"
Repository = "https://github.com/NCATSTranslator/Translator_component_toolkit"
Issues = "https://github.com/NCATSTranslator/Translator_component_toolkit/issues"

[project.scripts]
mcp-translator = "translator_component_toolkit.__main__:main"
tct-server = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/translator_component_toolkit"]

[tool.uv.sources]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "codespell>=2.2.0",
    "mypy>=1.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src/translator_component_toolkit",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=0",
    "--tb=short",
    "-v"
]

[tool.ruff]
exclude = ["notebooks/"]
