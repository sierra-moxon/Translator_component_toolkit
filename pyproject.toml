[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "TCT"
version = "0.1.2"
description = "Translator Component Toolkit"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Guangrong Qin", email = "guangrong.qin@isbscience.org"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
dependencies = [
    "requests",
    "jsons",
    "pandas",
    "seaborn", 
    "matplotlib",
    "ipycytoscape",
    "networkx",
    "numpy",
    "openai",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/NCATSTranslator/Translator_component_toolkit"
Documentation = "https://ncatstranslator.github.io/Translator_component_toolkit/"
Repository = "https://github.com/NCATSTranslator/Translator_component_toolkit"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=TCT",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v"
]

[tool.hatch.build.targets.wheel]
packages = ["TCT"]